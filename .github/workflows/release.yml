name: Release

on:
  workflow_dispatch:

permissions:
  contents: write # create tag + release
  pages: write # deploy the Kodi repo
  id-token: write # deploy-pages OIDC

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release from a non-main ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::release must be dispatched from main (got ${GITHUB_REF})"
            exit 1
          fi

      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0 # tags for the duplicate check and <news>

      - uses: astral-sh/setup-uv@v8.3.2

      - run: uv sync --locked

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(uv run python -c 'import tomllib, pathlib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Refuse to re-release an existing tag
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists - bump pyproject.toml first"
            exit 1
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - run: uv run poe check

      - run: uv run poe build

      - name: Tag and create GitHub Release
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" build/*.zip \
            --title "v${VERSION}" --generate-notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}

  kodi-repo:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }} # same commit the release built from
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.3.2

      - run: uv sync --locked

      - name: Collect every released zip (all versions stay installable)
        run: |
          mkdir -p build
          for tag in $(gh release list --limit 1000 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern '*.zip' --dir build --skip-existing
          done
        env:
          GH_TOKEN: ${{ github.token }}

      # NOT 'poe repo': that would rebuild the addon zip at the now-tagged
      # commit, collapsing <news> (git describe sees the new tag) and making
      # Pages serve different bytes than the Release asset. The downloaded
      # Release assets are the storage of record; repo.py only builds the
      # repository add-on and assembles the tree.
      - run: uv run python scripts/repo.py

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/repo

      - id: deployment
        uses: actions/deploy-pages@v5.0.0
